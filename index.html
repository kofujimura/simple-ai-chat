<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple AI Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Simple AI Chat</h1>
            <div class="settings-icon" onclick="toggleAccordion()">⚙️</div>
        </div>

        <!-- AI設定アコーディオン -->
        <div class="accordion" id="settingsAccordion">
            <div class="accordion-content">
                <div class="form-group">
                    <label for="provider">AI Provider:</label>
                    <select id="provider" onchange="saveSettings()">
                        <option value="gemini">Google Gemini</option>
                        <option value="openai">OpenAI</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="apiKey">API Key:</label>
                    <input type="password" id="apiKey" placeholder="Enter your API key" onchange="saveSettings()">
                </div>

                <div class="form-group">
                    <label for="systemPrompt">System Prompt:</label>
                    <textarea id="systemPrompt" placeholder="You are a helpful assistant." onchange="saveSettings()"></textarea>
                </div>

                <div class="form-group">
                    <label for="model">Model:</label>
                    <select id="model" onchange="saveSettings()">
                    </select>
                </div>

                <div class="form-group">
                    <label for="temperature">Temperature (0-1):</label>
                    <input type="number" id="temperature" min="0" max="1" step="0.1" value="0.7" onchange="saveSettings()">
                </div>

                <div class="form-group">
                    <label for="userNickname">User Nickname:</label>
                    <input type="text" id="userNickname" placeholder="Enter your nickname" onchange="saveSettings()">
                </div>

                <div class="form-group">
                    <label for="aiNickname">AI Nickname:</label>
                    <input type="text" id="aiNickname" placeholder="Enter AI nickname" onchange="saveSettings()">
                </div>

                <button class="btn" onclick="clearChat()">Clear Chat</button>
            </div>
        </div>

        <!-- チャットエリア -->
        <div class="chat-container">
            <div class="messages" id="messages"></div>
            <div class="loading" id="loading">AI is thinking...</div>
        </div>

        <!-- 入力エリア -->
        <div class="input-container">
            <input type="text" id="messageInput" class="message-input" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">→</button>
        </div>

        <div class="status" id="status">Ready</div>
    </div>

    <script>
        const OPENAI_API_ENDPOINT = 'https://api.openai.com/v1/chat/completions';
        const GEMINI_API_BASE_URL = 'https://generativelanguage.googleapis.com/v1beta/models/';

        let conversationHistory = [];

        // 初期化
        document.addEventListener('DOMContentLoaded', function() {
            updateModelOptions(); // 先にモデルリストを生成
            loadSettings();
            checkApiKeyAndToggleAccordion();
            updateStatus();
        });

        // 設定の保存
        function saveSettings() {
            const provider = document.getElementById('provider').value;
            const currentApiKey = document.getElementById('apiKey').value;

            // 既存の設定を読み込み、新しい設定で更新
            const savedSettings = localStorage.getItem('aiChatSettings');
            let settings = savedSettings ? JSON.parse(savedSettings) : {};

            settings.provider = provider;
            if (provider === 'openai') {
                settings.openaiApiKey = currentApiKey;
            } else if (provider === 'gemini') {
                settings.geminiApiKey = currentApiKey;
            }
            settings.systemPrompt = document.getElementById('systemPrompt').value || 'You are a helpful assistant.';
            settings.model = document.getElementById('model').value;
            settings.temperature = parseFloat(document.getElementById('temperature').value);
            settings.userNickname = document.getElementById('userNickname').value || 'User';
            settings.aiNickname = document.getElementById('aiNickname').value || 'AI';

            localStorage.setItem('aiChatSettings', JSON.stringify(settings));
            updateModelOptions(true); // 設定保存時にモデルを再選択
            checkApiKeyAndToggleAccordion();
            updateStatus();
        }

        // 設定の読み込み
        function loadSettings() {
            const saved = localStorage.getItem('aiChatSettings');
            if (saved) {
                const settings = JSON.parse(saved);
                document.getElementById('provider').value = settings.provider || 'gemini';
                // プロバイダーに応じたAPIキーをセット
                const provider = settings.provider || 'gemini';
                document.getElementById('apiKey').value = (provider === 'openai' ? settings.openaiApiKey : settings.geminiApiKey) || '';

                document.getElementById('systemPrompt').value = settings.systemPrompt || 'You are a helpful assistant.';
                const defaultModel = (settings.provider || 'gemini') === 'gemini' ? 'gemini-2.5-flash-lite' : 'gpt-3.5-turbo';
                document.getElementById('model').value = settings.model || defaultModel;
                document.getElementById('temperature').value = settings.temperature || 0.7;
                document.getElementById('userNickname').value = settings.userNickname || '';
                document.getElementById('aiNickname').value = settings.aiNickname || '';
            } else {
                // 初回起動時：デフォルト設定を保存
                saveSettings();
            }
        }

        // プロバイダーに応じてモデル選択肢を更新
        function updateModelOptions(keepSelection = false) {
            const provider = document.getElementById('provider').value;
            const modelSelect = document.getElementById('model');

            // プロバイダー変更時に対応するAPIキーを表示
            const settings = JSON.parse(localStorage.getItem('aiChatSettings')) || {};
            document.getElementById('apiKey').value = (provider === 'openai' ? settings.openaiApiKey : settings.geminiApiKey) || '';

            const currentModel = modelSelect.value;
            
            modelSelect.innerHTML = '';
            let modelExists = false;
            
            if (provider === 'openai') {
                modelSelect.innerHTML = `
                    <option value="gpt-4o-mini">GPT-4o mini</option>
                    <option value="gpt-5-mini">GPT-5 Mini</option>
                `;
            } else if (provider === 'gemini') {
                modelSelect.innerHTML = `
                    <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash Lite</option>
                    <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                `;
            }

            if (keepSelection) {
                // 以前選択されていたモデルが存在するかチェック
                for (let i = 0; i < modelSelect.options.length; i++) {
                    if (modelSelect.options[i].value === currentModel) {
                        modelSelect.value = currentModel;
                        modelExists = true;
                        break;
                    }
                }
                // プロバイダー変更後、以前のモデルが存在しない場合は、新しいリストの先頭のモデルを保存する
                if (!modelExists) {
                    document.getElementById('model').value = modelSelect.options[0].value;
                    saveSettings();
                }
            }
        }

        // APIキーの有無でアコーディオンの初期状態を制御
        function checkApiKeyAndToggleAccordion() {
            const apiKey = document.getElementById('apiKey').value;
            const accordion = document.getElementById('settingsAccordion');
            
            if (!apiKey.trim()) {
                accordion.classList.add('open');
            }
            // APIキーがある場合は自動的に閉じないように変更
        }

        // アコーディオンの開閉
        function toggleAccordion() {
            const accordion = document.getElementById('settingsAccordion');
            accordion.classList.toggle('open');
        }

        // ステータス更新
        function updateStatus() {
            const apiKey = document.getElementById('apiKey').value;
            const provider = document.getElementById('provider').value;
            const statusEl = document.getElementById('status');
            
            if (!apiKey.trim()) {
                statusEl.textContent = `Please set your ${provider.toUpperCase()} API key`;
                statusEl.style.color = '#dc3545';
            } else {
                statusEl.textContent = `Ready with ${provider.toUpperCase()}`;
                statusEl.style.color = '#28a745';
            }
        }

        // メッセージ送信
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            const apiKey = document.getElementById('apiKey').value;
            if (!apiKey.trim()) {
                showError('Please set your API key first');
                return;
            }

            // ユーザーメッセージを表示
            addMessage(message, 'user');
            input.value = '';
            
            // 送信ボタンを無効化
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            
            // ローディング表示
            document.getElementById('loading').classList.add('show');

            try {
                const response = await getAIResponse(message);
                addMessage(response, 'ai');
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to get AI response: ' + error.message);
            } finally {
                sendBtn.disabled = false;
                document.getElementById('loading').classList.remove('show');
            }
        }

        // AI応答を取得
        async function getAIResponse(message) {
            let settings = JSON.parse(localStorage.getItem('aiChatSettings'));
            const provider = settings.provider;
            
            // 会話履歴に追加
            conversationHistory.push({ role: 'user', content: message });
            
            if (provider === 'openai') {
                // OpenAI用のAPIキーをsettings.apiKeyにセット
                settings.apiKey = settings.openaiApiKey;
                return await getOpenAIResponse(settings);
            } else if (provider === 'gemini') {
                // Gemini用のAPIキーをsettings.apiKeyにセット
                settings.apiKey = settings.geminiApiKey;
                return await getGeminiResponse(settings);
            }
        }

        // OpenAI API呼び出し
        async function getOpenAIResponse(settings) {
            const messages = [
                { role: 'system', content: settings.systemPrompt },
                ...conversationHistory.slice(-10) // 最新10件のみ
            ];

            const response = await fetch(OPENAI_API_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${settings.apiKey}`
                },
                body: JSON.stringify({
                    model: settings.model,
                    messages: messages,
                    temperature: settings.temperature,
                    max_completion_tokens: 1000
                })
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error?.message || 'OpenAI API error');
            }

            const data = await response.json();
            const aiResponse = data.choices[0].message.content;
            
            // 会話履歴に追加
            conversationHistory.push({ role: 'assistant', content: aiResponse });
            
            return aiResponse;
        }

        // Gemini API呼び出し
        async function getGeminiResponse(settings) {
            const prompt = `${settings.systemPrompt}\n\nConversation:\n${conversationHistory.map(msg => `${msg.role}: ${msg.content}`).join('\n')}\n\nassistant:`;

            const response = await fetch(`${GEMINI_API_BASE_URL}${settings.model}:generateContent?key=${settings.apiKey}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: prompt }]
                    }],
                    generationConfig: {
                        temperature: settings.temperature,
                        maxOutputTokens: 1000
                    }
                })
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error?.message || 'Gemini API error');
            }

            const data = await response.json();
            const aiResponse = data.candidates[0].content.parts[0].text;
            
            // 会話履歴に追加
            conversationHistory.push({ role: 'assistant', content: aiResponse });
            
            return aiResponse;
        }

        // メッセージを画面に追加
        function addMessage(content, sender) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const avatarContainer = document.createElement('div');
            avatarContainer.className = 'avatar-container';
            
            // ニックネーム表示
            const nickname = document.createElement('div');
            nickname.className = 'nickname';
            
            const settings = JSON.parse(localStorage.getItem('aiChatSettings')) || {};
            const userNickname = settings.userNickname || 'User';
            const aiNickname = settings.aiNickname || 'AI';
            
            nickname.textContent = sender === 'user' ? userNickname : aiNickname;
            
            // アイコン画像
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            
            const avatarImg = document.createElement('img');
            avatarImg.className = 'avatar-img';
            avatarImg.src = sender === 'user' ? 'userIcon.png' : 'aiIcon.png';
            avatarImg.alt = sender === 'user' ? userNickname : aiNickname;
            
            avatar.appendChild(avatarImg);
            avatarContainer.appendChild(nickname);
            avatarContainer.appendChild(avatar);
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = content;
            
            messageDiv.appendChild(avatarContainer);
            messageDiv.appendChild(bubble);
            messagesDiv.appendChild(messageDiv);
            
            // 最新メッセージまでスクロール
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // エラー表示
        function showError(message) {
            const messagesDiv = document.getElementById('messages');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = message;
            messagesDiv.appendChild(errorDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // チャットクリア
        function clearChat() {
            document.getElementById('messages').innerHTML = '';
            conversationHistory = [];
        }

        // Enterキーでメッセージ送信
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
